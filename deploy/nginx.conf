user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Excluir argumentos para no registrar códigos OAuth en la URL de callback.
    log_format tickets '$time_iso8601 $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log tickets;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 10k;
    limit_req_status 429;
    limit_req_zone $server_name zone=tickets:1m rate=5r/s;
    map $http_x_origin_verify $origin_allowed {
        default 0;
        "__ORIGIN_SECRET__" 1;
    }
    server {
        listen 80 default_server;
        server_name _;
        if ($origin_allowed = 0) { return 403; }
        root /var/www/tickets;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location /api/ {
            limit_req zone=tickets burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_hide_header X-Powered-By;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
